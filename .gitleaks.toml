# Configuration of the secret scan (the `scan` job in .github/workflows/ci.yaml). It extends the
# default rule set and adds two narrow allowlists. Everything else is still reported, including any
# other secret in the same file. The allowlists are documented in docs/ci-cd.md and exercised by
# .github/scripts/test-gitleaks.sh.
title = "youtube-workspace"

[extend]
useDefault = true

# API token row ids are UUIDs (the database primary key), not secrets: a secret token is always
# `ytw_` followed by random characters. The generic rule reads `tokenId: "<uuid>"` as a key
# assignment. The pattern is tested against the matched text only (not the line), so another
# secret on the same line is still reported, and it needs a UUID after a key named token id, so a
# real token assigned to that key is still reported.
[[allowlists]]
description = "UUID values assigned to a key named tokenId or token_id"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''(?i)token_?id["']?\s*[:=]+\s*["']?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
]

[[allowlists]]
description = "Deliberately fake credentials in the redaction tests of @ytw/observability"
# Both conditions must hold: the finding is in this file AND its line holds one of the fake values
# below. A real secret added to this file, or one of these values in another file, is reported.
condition = "AND"
paths = ['''^packages/observability/test/helpers\.ts$''']
regexTarget = "line"
# The `SECRET` fixtures in that file exist so the tests can prove these exact values never reach a
# log line, so they must look like real credentials. They protect nothing.
regexes = [
  '''ytw_Zq8vK2mXpL0aYb7dN3sQ9wRtUe5hJc1GfTiOk4VnM''',
  '''eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiJvd25lci0xMjM0NTYifQ\.c2lnbmF0dXJlLXZhbHVlLWhlcmU''',
  '''hunter2-correct-horse-battery''',
  '''cs-live-8f7a6b5c4d3e2f1a0b9c''',
  '''Tr0ub4dor-and-3-pg-pass''',
]
