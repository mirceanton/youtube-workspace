---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: OIDC E2E
permissions: { contents: read }

on:
  workflow_dispatch: {}
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "claude/**", "codex/**", "renovate/**"]
    paths:
      - ".github/actions/setup/action.yaml"
      - ".github/workflows/e2e.yaml"
      - "apps/mcp/**"
      - "apps/web-server/**"
      - "apps/web-ui/**"
      - "dev/keycloak/**"
      - "docker-compose.yml"
      - "e2e/**"
      - "packages/db/**"
      - "packages/observability/**"
      - "packages/shared/**"
      - "packages/tokens/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oidc-e2e:
    name: Browser flow against Keycloak
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: ytw-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_IDP: keycloak
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      E2E_BASE_URL: http://127.0.0.1:5173
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Remove shared build output before source-resolution E2E
        run: |
          rm -rf packages/shared/dist
          test ! -e packages/shared/dist

      - name: Start isolated Postgres and import the dev realm
        run: docker compose up --detach --wait --wait-timeout 300 postgres keycloak

      - name: Install Chromium and its system dependencies
        run: pnpm --filter @ytw/e2e exec playwright install --with-deps chromium

      - name: Migrate an isolated database and run the browser scenario
        run: pnpm --filter @ytw/e2e run test:e2e

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200 postgres keycloak

      - name: Remove this run's containers and volume
        if: always()
        run: docker compose down --volumes --remove-orphans
