---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI
permissions: { contents: read }

# One workflow, so the cost of a push is the cost of the jobs that have a reason to run.
#   - Pushes that only change documentation (docs/, *.md, LICENSE) start nothing.
#   - `check` (lint, typecheck, format, build, workflow lint, a secret scan of the pushed commits)
#     and `test` run on every other push.
#   - `images`, `scan` and `codeql` are heavy. They always run for pull requests, pushes to main,
#     manual runs and the weekly schedule. On other pushes (the shared integration branch has no
#     pull request flow yet) they run only if a path that can change them was touched or the head
#     commit message contains the token [ci full]; .github/scripts/ci-gate.sh decides.
# Pull requests are not path filtered, so their required checks always report.
# GitHub skips every workflow for a push whose head commit message contains [skip ci], [ci skip],
# [no ci], [skip actions] or [actions skip]; main still needs a green run before a release.
on:
  workflow_dispatch: {}
  pull_request: { branches: ["main"] }
  push:
    branches: ["main", "claude/**", "codex/**", "renovate/**"]
    paths-ignore: ["docs/**", "*.md", "**/*.md", "LICENSE"]
  # Weekly, so new advisories are noticed without any commit.
  schedule: [{ cron: "23 4 * * 1" }]

# One run per commit; only pull request runs are cancelled by a newer push, so every commit of the
# shared integration branch keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
  GITLEAKS_VERSION: "8.30.1"

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      heavy: ${{ steps.gate.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history, for the secret scan of the commits this push added (a few seconds).
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the heavy jobs run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: .github/scripts/ci-gate.sh
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Lint the workflows (actionlint)
        run: mise exec -- actionlint
      - name: Test the CI helper scripts
        run: .github/scripts/test-scripts.sh
      # Only the commits this push added, so a secret committed in ordinary source is found on the
      # push that adds it, not only by the next full run; the `scan` job rescans the whole history.
      - name: Scan the commits of this push for secrets (gitleaks)
        if: ${{ github.event_name == 'push' }}
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: mise exec "aqua:gitleaks/gitleaks@${GITLEAKS_VERSION}" -- .github/scripts/scan-new-commits.sh
      - name: Typecheck and lint (tsc -b and oxlint)
        run: mise exec -- pnpm lint
      - name: Check formatting
        run: mise exec -- pnpm format:check
      # The PRD asks for lint, tests and a build on every pull request; this is the build.
      - name: Build (tsc -b per package, vite build for the web UI)
        run: mise exec -- pnpm build
      - name: Check the build output exists
        run: |
          for file in \
            apps/web-server/dist/src/index.js \
            apps/mcp/dist/src/index.js \
            apps/web-ui/dist/index.html; do
            test -f "$file" || { echo "::error::missing build output: $file"; exit 1; }
          done

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway Postgres, as in docker-compose.yml. Integration tests create and drop their own
    # uniquely named databases on it, so the superuser connection below is the one they need.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: youtube_workspace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d youtube_workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    env:
      # Dev-only credentials of the service container above; nothing real is configured here.
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/youtube_workspace
      # The @ytw/db test harness never falls back to MIGRATION_DATABASE_URL (docs/database.md).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Apply migrations
        run: mise exec -- pnpm migrate
      - name: Apply migrations again (must be a no-op)
        run: mise exec -- pnpm migrate
      - name: Run unit and integration tests
        run: mise exec -- pnpm test
      # The root run loads every package as a vitest project, and vitest ignores per-package
      # coverage thresholds there. The policy package enforces 100 % coverage (PLAN T20), so its
      # own script, which runs with --coverage, is the one that gates it.
      - name: Run the policy tests with the coverage gate
        run: mise exec -- pnpm --filter @ytw/policy test

  images:
    name: Image ${{ matrix.target }}
    needs: check
    if: ${{ needs.check.outputs.heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            service: web-server
            port: 3000
          - target: mcp
            service: mcp
            port: 3001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute build metadata
        id: build-meta
        run: echo "version=0.0.0-ci.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Files that exist on a developer machine (apps/<app>/.env, key files, ...) are untracked, so
      # only .dockerignore stands between them and `COPY . .`. Plant some in the build context;
      # docker/smoke.sh fails if any of them, or a file with the sentinel, ends up in the image.
      - name: Plant local files that must not reach the image
        id: plant
        run: echo "sentinel=$(docker/plant-local-files.sh)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (linux/amd64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.target }}.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ytw-${{ matrix.target }}:ci
          build-args: |
            APP_VERSION=${{ steps.build-meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.target }}
          cache-to: type=gha,scope=docker-${{ matrix.target }},mode=max
      - name: Smoke-test the image
        env:
          TARGET: ${{ matrix.target }}
          SERVICE: ${{ matrix.service }}
          PORT: ${{ matrix.port }}
          VERSION: ${{ steps.build-meta.outputs.version }}
          SENTINEL: ${{ steps.plant.outputs.sentinel }}
        run: docker/smoke.sh "ytw-${TARGET}:ci" "$SERVICE" "$PORT" "$VERSION" "$GITHUB_SHA" "$SENTINEL"
      - name: Scan the image (Trivy)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ytw-${{ matrix.target }}:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
      # The arm64 image is only published with a release. Building it under QEMU on every push would
      # get slow as the dependency tree grows, so it is checked on main (which includes the weekly
      # run) and on request; the publish workflow builds both platforms for every release.
      - name: Set up QEMU
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Build image (linux/amd64 and linux/arm64, not published)
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.target }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.build-meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.target }}

  scan:
    name: Dependency, filesystem and secret scans
    needs: check
    if: ${{ needs.check.outputs.heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # The steps below are independent, so one finding does not hide the others.
      # Dependencies are covered by this audit and by the Trivy image scans in the `images` job
      # (their node-pkg targets), not by the filesystem scan below.
      - name: Audit dependencies (fails on high or critical advisories)
        run: mise exec -- pnpm audit --audit-level=high
      # Secrets in the tree and misconfigurations (the Dockerfiles). Trivy does not parse pnpm 12's
      # two-document pnpm-lock.yaml, so this scan lists no lockfile and reports no dependency
      # vulnerability; `vuln` stays on so it starts to once Trivy does.
      - name: Scan the repository (Trivy)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
      # The gitleaks CLI instead of gitleaks-action: the action demands a license key for
      # organization-owned repositories, the CLI is MIT licensed. mise verifies the download.
      # .gitleaks.toml extends the default rules and allowlists only the known fake fixtures.
      - name: Scan the git history for secrets (gitleaks)
        if: ${{ !cancelled() }}
        run: mise exec "aqua:gitleaks/gitleaks@${GITLEAKS_VERSION}" -- gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .
      - name: Check that the secret scan still catches secrets
        if: ${{ !cancelled() }}
        run: mise exec "aqua:gitleaks/gitleaks@${GITLEAKS_VERSION}" -- .github/scripts/test-gitleaks.sh

  # Code scanning and dependency review are free for public repositories and need GitHub Code
  # Security on private ones. They run when the repository is public, or when the repository
  # variable CODE_SECURITY_ENABLED is set to "true" (docs/ci-cd.md). Otherwise they are skipped.
  codeql:
    name: CodeQL (JavaScript and TypeScript)
    needs: check
    if: ${{ needs.check.outputs.heavy == 'true' && (github.event.repository.private == false || vars.CODE_SECURITY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && (github.event.repository.private == false || vars.CODE_SECURITY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
