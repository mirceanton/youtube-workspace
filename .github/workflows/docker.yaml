---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docker
permissions: { contents: read }

# The only image build: it runs when a GitHub release is published (see release.yaml) and pushes
# the images to ghcr.io. There is no build-on-push anymore; the release is only cut from a commit
# whose CI runs were green (lint.yaml and test.yaml).
on:
  release:
    types: ["published"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    # Forks have no registry credentials to use.
    if: ${{ github.repository_owner == 'mirceanton' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            service: web-server
            port: 3000
          - target: mcp
            service: mcp
            port: 3001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.release.tag_name }}"
          persist-credentials: false
      # Whoever created the release, even by hand on an arbitrary commit, only a commit whose CI
      # run on main is green is published.
      - name: Require a green CI run for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: .github/scripts/verify-ci.sh
      - name: Compute build metadata
        id: build-meta
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
      # Files that exist on a developer machine (apps/<app>/.env, key files, ...) are untracked, so
      # only .dockerignore stands between them and `COPY . .`. Plant some in the build context;
      # docker/smoke.sh fails if any of them, or a file with the sentinel, ends up in the image.
      - name: Plant local files that must not reach the image
        id: plant
        run: echo "sentinel=$(docker/plant-local-files.sh)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Last check before anything is pushed: the amd64 image of this exact commit must boot, be
      # healthy as a non-root user and report the version and commit stamped into it.
      - name: Build image for the smoke test (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.target }}.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ytw-${{ matrix.target }}:release
          build-args: |
            APP_VERSION=${{ steps.build-meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.target }}
      - name: Smoke-test the image
        env:
          TARGET: ${{ matrix.target }}
          SERVICE: ${{ matrix.service }}
          PORT: ${{ matrix.port }}
          VERSION: ${{ steps.build-meta.outputs.version }}
          SENTINEL: ${{ steps.plant.outputs.sentinel }}
        run: docker/smoke.sh "ytw-${TARGET}:release" "$SERVICE" "$PORT" "$VERSION" "$GITHUB_SHA" "$SENTINEL"
      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      # `latest` is added automatically for stable (non pre-release) semver tags. The bare major tag
      # is skipped while the version is 0.y.z, which makes no stability promise.
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mirceanton/youtube-workspace-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.target }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build-meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          # Supply-chain metadata attached to the image index in the registry.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=docker-${{ matrix.target }}
