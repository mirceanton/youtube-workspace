---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint
permissions: { contents: read }

# Pushes to claude/** are included because the integration branch has no pull request flow yet.
on:
  workflow_dispatch: {}
  pull_request: { branches: ["main"] }
  push: { branches: ["main", "claude/**", "renovate/**"] }

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow syntax (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Run actionlint
        run: mise exec -- actionlint

  lint:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run lint (tsc -b and oxlint)
        run: mise exec -- pnpm lint
      - name: Check formatting
        run: mise exec -- pnpm format:check
