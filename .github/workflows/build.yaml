---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build
permissions: { contents: read }

# The PRD asks for lint, tests and a build on every pull request; this is the build gate.
# Pushes to claude/** are included because the integration branch has no pull request flow yet.
on:
  workflow_dispatch: {}
  pull_request: { branches: ["main"] }
  push: { branches: ["main", "claude/**", "renovate/**"] }

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build every package and the web UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Build (tsc -b per package, vite build for the web UI)
        run: mise exec -- pnpm build
      - name: Check the build output exists
        run: |
          for file in \
            apps/web-server/dist/src/index.js \
            apps/mcp/dist/src/index.js \
            apps/web-ui/dist/index.html; do
            test -f "$file" || { echo "::error::missing build output: $file"; exit 1; }
          done
