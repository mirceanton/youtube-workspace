---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup workspace
description: Install the pinned toolchain with mise and the workspace dependencies with pnpm
# Call after actions/checkout. Every later step runs tools through `mise exec --`, so the versions
# pinned in .mise.toml are the ones used, exactly as on a developer machine.

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0

    - name: Locate the pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache the pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: mise exec -- pnpm install --frozen-lockfile
