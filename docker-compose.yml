# Local development only.
#   docker compose up -d                   Postgres on 127.0.0.1:5432, then `pnpm dev` for the app
#   docker compose --profile app up -d     also build and run the production image on :3000
#   docker compose down -v                 stop and delete all local data
name: youtube-workspace

services:
  postgres:
    image: postgres:18
    environment:
      # Dev-only credentials. The superuser owns the database, like the CloudNativePG app user does.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: youtube_workspace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youtube_workspace"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    profiles: ["app"]
    build: .
    # image: ghcr.io/mirceanton/youtube-workspace:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only: without OIDC_* the app has no login (single-user mode).
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/youtube_workspace
      LOG_LEVEL: info

      # The LLM gateway's token. Generate one with:
      #   openssl rand -base64 32 | tr '+/' '-_' | tr -d '=' | sed 's/^/ytw_/'
      # Unset = no seeded token (an existing one is revoked on the next boot).
      # MCP_BOOTSTRAP_TOKEN: ytw_changeme
      # MCP_BOOTSTRAP_TOKEN_NAME: bootstrap
      # MCP_BOOTSTRAP_TOKEN_PERMISSIONS: ideas=write,scripts=write,experiments=write,videos=write,notes=write,activity=read

      # OIDC login (Authelia, Authentik, Zitadel, etc.). Leave unset for
      # single-user mode (no login screen). If set, all four OIDC_* variables
      # plus SESSION_SECRET are required.
      # OIDC_ISSUER_URL: https://auth.example.com
      # OIDC_CLIENT_ID: youtube-workspace
      # OIDC_CLIENT_SECRET: changeme
      # OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      # OIDC_REQUIRED_GROUP: youtube-workspace-users
      # SESSION_SECRET: changeme-32-chars-minimum

      # When set, GET /metrics requires `Authorization: Bearer <token>`.
      # METRICS_TOKEN: changeme
    restart: unless-stopped

volumes:
  postgres-data:
